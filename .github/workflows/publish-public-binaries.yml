name: Publish public binary preview release
on:
  workflow_run:
    workflows: ["Windows compile (not full UI validation)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  publish-binaries:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Locate matching successful private Windows CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(grep -oP '(?<=<Version>)[^<]+' AltTabFlow.csproj | head -1)"
          HEAD="$(git rev-parse HEAD)"
          RUN="$(gh api "repos/$REPO/actions/workflows/windows-build.yml/runs?branch=main&status=success&per_page=30" \
            --jq ".workflow_runs[] | select(.head_sha == \"$HEAD\") | .id" | head -1)"
          test -n "$VERSION" && test -n "$RUN"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN" >> "$GITHUB_OUTPUT"
      - name: Download CI-validated executable only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ steps.ci.outputs.run_id }}
        run: |
          mkdir -p candidate
          gh run download "$RUN" --repo "$REPO" --name AltTabFlow-win-x64-CANDIDATE --dir candidate
          for f in AltTabFlow.exe Game-compat-mode.cmd Run-GameCompat.ps1 사용법.txt; do
            test -s "candidate/$f"
          done
      - name: Pack binary allowlist + SHA256
        run: |
          set -euo pipefail
          (cd candidate && zip -j -9 ../AltTabFlow-win-x64.zip AltTabFlow.exe Game-compat-mode.cmd Run-GameCompat.ps1 사용법.txt)
          sha256sum AltTabFlow-win-x64.zip > SHA256SUMS.txt
          test "$(unzip -Z1 AltTabFlow-win-x64.zip | wc -l | tr -d ' ')" = "4"
          if unzip -Z1 AltTabFlow-win-x64.zip | grep -v -x -E 'AltTabFlow.exe|Game-compat-mode.cmd|Run-GameCompat.ps1|사용법.txt'; then
            echo "::error::Unexpected file in distribution"
            exit 1
          fi
      - name: Publish to public binary-only repository
        env:
          GH_TOKEN: ${{ secrets.ALTTABFLOW_PUBLIC_RELEASE_TOKEN }}
          TARGET: hossea123456789-design/AltTabFlow-Downloads
          VERSION: ${{ steps.ci.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PUBLIC RELEASE NOT PUBLISHED — create public repo and set ALTTABFLOW_PUBLIC_RELEASE_TOKEN in private repo Actions secrets"
            echo "NOT PUBLISHED: configure public binary repo and deploy secret once." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$(gh api "repos/$TARGET" --jq '.visibility')" = "public"
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$TARGET" >/dev/null 2>&1; then
            echo "Existing release $TAG preserved; will never overwrite assets." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$TAG" AltTabFlow-win-x64.zip SHA256SUMS.txt \
            --repo "$TARGET" --title "AltTabFlow $VERSION · Windows x64 Preview" \
            --notes "CI-validated EXE preview; only binary ZIP and SHA256SUMS.txt are attached. Private source remains private. Game/UAC/end-to-end update testing remains pending." \
            --prerelease --latest=false
          echo "Published binary-only release $TARGET $TAG" >> "$GITHUB_STEP_SUMMARY"
