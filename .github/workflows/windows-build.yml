name: Windows compile (not full UI validation)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Build and publish candidate
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify source/resource SHA-256 manifest
        shell: pwsh
        run: .\tools\Verify-SourceHashes.ps1
      - name: Install .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile release
        shell: pwsh
        run: |
          dotnet restore .\AltTabFlow.csproj --runtime win-x64 -p:PublishReadyToRun=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\AltTabFlow.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish self-contained candidate
        shell: pwsh
        run: |
          dotnet publish .\AltTabFlow.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=true -p:EnableCompressionInSingleFile=false -p:DebugType=None -p:DebugSymbols=false --output .\artifacts\ci-publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path '.\artifacts\ci-publish\AltTabFlow.exe')) { throw 'Missing candidate executable' }
      - name: Validate missed-keyup recovery and input self-tests (206 cases)
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) 'artifacts\ci-publish\AltTabFlow.exe'
          $check = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru -Wait -WindowStyle Hidden
          $reportPath = Join-Path $env:LOCALAPPDATA 'AltTabFlow\self-test.json'
          if (-not (Test-Path -LiteralPath $reportPath)) { throw 'Missing self-test report' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          $count = @($report.tests | Where-Object { $_.PSObject.Properties.Name -contains 'passed' -and $_.passed }).Count
          Write-Host "Basic self tests: $count passed; failures=$($report.failures)"
          if ($check.ExitCode -ne 0 -or $report.failures -ne 0 -or $count -ne 206) { throw 'Navigation self-test did not pass 206/206' }
          New-Item -ItemType Directory -Force -Path 'artifacts\ci-tests' | Out-Null
          Copy-Item -LiteralPath $reportPath -Destination 'artifacts\ci-tests\self-test.json'
      - name: Upload basic navigation test report
        uses: actions/upload-artifact@v4
        with:
          name: AltTabFlow-v1.1.11-navigation-self-test
          path: artifacts/ci-tests/self-test.json
          if-no-files-found: error
          retention-days: 30
      - name: Validate maximized-game overlay and public update UI tests (85 cases)
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) 'artifacts\ci-publish\AltTabFlow.exe'
          $test = Start-Process -FilePath $exe -ArgumentList '--ui-self-test' -WindowStyle Hidden -Wait -PassThru
          $file = Join-Path $env:LOCALAPPDATA 'AltTabFlow\ui-test.json'
          if (!(Test-Path -LiteralPath $file)) { throw 'UI test report missing' }
          $report = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
          $passed = @($report.tests | Where-Object { $_.PSObject.Properties.Name -contains 'passed' -and $_.passed }).Count
          Write-Host "UI tests passed=$passed; failures=$($report.failures); DPI=$($report.dpi)"
          if ($test.ExitCode -ne 0 -or $report.failures -ne 0 -or $passed -ne 85) { throw 'UI regression failed or count mismatch (expected 85)' }
          New-Item -ItemType Directory -Force 'artifacts\ci-tests' | Out-Null
          Copy-Item -LiteralPath $file -Destination 'artifacts\ci-tests\ui-test.json'
      - name: Upload UI test report
        uses: actions/upload-artifact@v4
        with:
          name: AltTabFlow-v1.1.11-UI-self-test
          path: artifacts/ci-tests/ui-test.json
          if-no-files-found: error
          retention-days: 30
      - name: Validate public release updater and package self-tests (22 cases)
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) 'artifacts\ci-publish\AltTabFlow.exe'
          $test = Start-Process -FilePath $exe -ArgumentList '--updater-self-test' -Wait -PassThru -WindowStyle Hidden
          $file = Join-Path $env:LOCALAPPDATA 'AltTabFlow\updater-test.json'
          if (!(Test-Path $file)) { throw 'Missing updater self-test report' }
          $report = Get-Content $file -Raw | ConvertFrom-Json
          $passed = @($report.tests | Where-Object {$_.passed}).Count
          if ($test.ExitCode -ne 0 -or $report.failures -ne 0 -or $passed -ne 22) {
            throw "Updater tests failed: passed=$passed failures=$($report.failures)"
          }
          New-Item -ItemType Directory -Force 'artifacts\ci-tests' | Out-Null
          Copy-Item $file 'artifacts\ci-tests\updater-test.json'
      - name: Upload updater self-test report
        uses: actions/upload-artifact@v4
        with:
          name: AltTabFlow-v1.1.11-updater-self-test
          path: artifacts/ci-tests/updater-test.json
          if-no-files-found: error
          retention-days: 30
      - name: Validate elevated interactive startup plan (11 cases)
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) 'artifacts\ci-publish\AltTabFlow.exe'
          $test = Start-Process -FilePath $exe -ArgumentList '--startup-self-test' -Wait -PassThru -WindowStyle Hidden
          $file = Join-Path $env:LOCALAPPDATA 'AltTabFlow\startup-test.json'
          if (!(Test-Path $file)) { throw 'Missing elevated startup test report' }
          $report = Get-Content $file -Raw | ConvertFrom-Json
          $passed = @($report.tests | Where-Object {$_.passed}).Count
          if ($test.ExitCode -ne 0 -or $report.failures -ne 0 -or $passed -ne 11) {
            throw "Elevated startup tests failed: passed=$passed failures=$($report.failures)"
          }
          New-Item -ItemType Directory -Force 'artifacts\ci-tests' | Out-Null
          Copy-Item $file 'artifacts\ci-tests\startup-test.json'
      - name: Upload elevated startup report
        uses: actions/upload-artifact@v4
        with:
          name: AltTabFlow-v1.1.11-startup-self-test
          path: artifacts/ci-tests/startup-test.json
          if-no-files-found: error
          retention-days: 30
      - name: Capture actual UI preview on Windows runner
        id: screenshot
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet build .\tools\TestWindows\TestWindows.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tools\CapturePreview.ps1
      - name: Upload actual preview screenshot if available
        if: steps.screenshot.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AltTabFlow-actual-Windows-preview
          path: artifacts/ui-preview/AltTabFlow-1.1.11-actual.png
          if-no-files-found: error
          retention-days: 30
      - name: Capture actual 1.1.11 settings UI
        id: settings-screenshot
        shell: pwsh
        continue-on-error: true
        run: .\tools\CaptureSettings.ps1
      - name: Upload actual settings screenshot
        if: steps.settings-screenshot.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AltTabFlow-v1.1.11-settings-actual-Windows
          path: artifacts/ui-preview/AltTabFlow-1.1.11-settings-actual.png
          if-no-files-found: error
          retention-days: 30
      - name: Capture actual persistent updater dialog
        id: updater-screenshot
        shell: pwsh
        continue-on-error: true
        run: .\tools\CaptureUpdate.ps1
      - name: Upload updater dialog screenshot
        if: steps.updater-screenshot.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AltTabFlow-v1.1.11-updater-dialog-Windows
          path: artifacts/ui-preview/AltTabFlow-1.1.11-update-dialog.png
          if-no-files-found: error
          retention-days: 30
      - name: Stage a SINGLE folder executable with its game compatibility scripts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'artifacts\package\AltTabFlow' | Out-Null
          Copy-Item 'artifacts\ci-publish\AltTabFlow.exe' 'artifacts\package\AltTabFlow\AltTabFlow.exe'
          foreach ($name in @('Game-compat-mode.cmd','Run-GameCompat.ps1','사용법.txt')) {
            Copy-Item $name (Join-Path 'artifacts\package\AltTabFlow' $name)
          }
          $exe = Get-Item 'artifacts\package\AltTabFlow\AltTabFlow.exe'
          $version = $exe.VersionInfo.ProductVersion
          Write-Host "Candidate product version: $version"
          if ($version -notmatch '^1\.1\.11(?:[.+]|$)') { throw "Expected version 1.1.11, got $version" }
          foreach ($name in @('AltTabFlow.exe','Run-GameCompat.ps1','Game-compat-mode.cmd')) {
            if (!(Test-Path (Join-Path 'artifacts\package\AltTabFlow' $name))) { throw "Missing $name" }
          }
      - name: Upload candidate for manual Windows validation
        uses: actions/upload-artifact@v4
        with:
          name: AltTabFlow-win-x64-CANDIDATE
          path: artifacts/package/AltTabFlow/*
          if-no-files-found: error
          retention-days: 30
          # CI success does not imply real MapleStory/P4/UAC validation.
